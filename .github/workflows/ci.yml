name: Validate Formly source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install compiler test dependencies
        run: python -m pip install 'markdown-it-py>=3,<5' 'PyYAML>=6,<7'
      - name: Validate preserved sources and compiler fixtures
        run: python tools/project.py source
